[package]
name = "nexus-ai-dashboard"
version = "0.1.0"
description = "Nexus AI Local Observer desktop shell"
authors = ["Nexus AI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` pairs with `app.macOSPrivateApi` in tauri.conf.json so the
# transparent floating orb (UI Phase 1) also works on macOS. No-op on Linux.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads the Phase 1.1 SQLite timeline. `bundled` compiles SQLite in, so there
# is no system dependency to install.
rusqlite = { version = "0.31", features = ["bundled"] }

# ── Phase 6.1 — Native "Client Eyes" (replaces the Python tracker daemon) ───
# Cross-platform active-window title + app-name capture (X11/Wayland/macOS/Win).
active-win-pos-rs = "0.8"
# OS-level recursive filesystem watcher (inotify on Linux). Pure-Rust, so there
# is no extra system package to apt-install on the distributed .deb target.
notify = "6.1"
# RFC-3339 / ISO-8601 timestamps for the unified os-context event payload.
chrono = { version = "0.4", features = ["clock"] }

# Linux only: the WebKitGTK webview disables getUserMedia and auto-denies mic
# permission by default. We pin the SAME webkit2gtk version wry links (2.0.2) so
# `with_webview().inner()` hands back a matching `WebView` type, then enable
# media-stream + grant the permission request (Phase 7.3 voice-in fix).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[features]
# This feature is used for production builds (`tauri build`).
custom-protocol = ["tauri/custom-protocol"]
